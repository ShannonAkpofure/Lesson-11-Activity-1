<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: darkgreen;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .fact-file {
            background-color: lightcoral;
            width: 260px;
            color: darkslategray;
            padding: 25px;
            border: 4px solid blue;
            margin: 30px;
        }

        .animal-name {
            color: forestgreen;
            font-size: 22px;
        }

        .detail {
            color: darkslategray;
        }

        .cool-fact {
            color: rgb(112, 9, 9);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="fact-file">
        <h2 class="animal-nme">
            Snow Leopard
        </h2>
        <p class="detail">
            Type: Big Cat
        </p>
        <p class="detail">
            Lives in: Mountain ranges of Central Asia
        </p>
        <p class="detail">
            Diet: Deer, goats, and wild sheeps
        </p>
        <p class="cool-fact">
            Cool fact: Can leap up to 15 metres in one jump
        </p>
    </div>
</body>
</html>
